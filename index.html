<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dino Runner</title>
<style>
  html,body{margin:0;height:100%;background:#202124;overflow:hidden;font-family:monospace}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;max-width:100vw;max-height:100vh}
  .hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
        color:#6b6f73;font:14px Arial,sans-serif;pointer-events:none;letter-spacing:.5px}
</style>
</head>
<body>
<canvas id="c" width="600" height="180"></canvas>
<div class="hint">Space / tap to jump &nbsp;•&nbsp; ↓ to duck</div>
<script>
(() => {
"use strict";
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

// scale canvas to fit screen while keeping pixel look
function fit(){
  const maxW = Math.min(window.innerWidth - 20, 900);
  const s = maxW / 600;
  canvas.style.width = (600*s)+"px";
  canvas.style.height = (180*s)+"px";
}
window.addEventListener("resize", fit); fit();

const BG = "#202124", FG = "#e8eaed", DIM = "#6b6f73";
const GROUND = 130;

// ---------- audio (synth, no files needed) ----------
let actx;
function ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function jumpSound(){
  const a = ac(), o = a.createOscillator(), g = a.createGain();
  o.type = "square"; o.frequency.setValueAtTime(520, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(880, a.currentTime + 0.08);
  g.gain.setValueAtTime(0.06, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.09);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + 0.1);
}
function overSound(){
  const a = ac();
  [220, 160, 110].forEach((f, i) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(f, a.currentTime + i*0.09);
    g.gain.setValueAtTime(0.09, a.currentTime + i*0.09);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + i*0.09 + 0.15);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime + i*0.09); o.stop(a.currentTime + i*0.09 + 0.16);
  });
}
function pointSound(){
  const a = ac(), o = a.createOscillator(), g = a.createGain();
  o.type = "square"; o.frequency.setValueAtTime(950, a.currentTime);
  g.gain.setValueAtTime(0.05, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.05);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + 0.06);
}

// ---------- state ----------
let state = "ready"; // ready | running | over
let score = 0, hi = 0, speed = 6, t = 0, spawnTimer = 0;
let obstacles = [], groundDots = [], clouds = [];
let downHeld = false;
let lastMilestone = 0;

const dino = { x: 46, y: 0, w: 44, h: 44, vy: 0, duck: false, legFrame: 0, dead: false };

// ---------- pixel-matrix dino (procedurally built silhouette) ----------
const PX = 2; // size of one "pixel" block
function buildStandingMatrix(){
  const rows = 22, cols = 22, grid = [];
  for (let r = 0; r < rows; r++){
    let left, right;
    if (r < 6){                    // rounded head bump (top-right)
      left = 13 + Math.max(0, 4 - r); right = 21;
    } else if (r < 12){             // neck / upper body (wide)
      left = 3; right = 21 - Math.floor((r - 6) * 0.4);
    } else if (r < 17){             // lower body tapering toward tail
      left = Math.max(1, 3 - (r - 12)); right = 19 - (r - 12) * 2;
    } else {                        // tail tip
      left = 0; right = Math.max(2, 9 - (r - 17) * 2);
    }
    let row = "";
    for (let c = 0; c < cols; c++) row += (c >= left && c <= right) ? "1" : "0";
    grid.push(row);
  }
  return grid;
}
function buildDuckMatrix(){
  const rows = 13, cols = 28, grid = [];
  for (let r = 0; r < rows; r++){
    let left, right;
    if (r < 3){ left = 12; right = 27; }        // low head
    else if (r < 9){ left = 2; right = 25 - (r-3); } // long flat body
    else { left = 0; right = Math.max(2, 8 - (r-9)*2); } // tail
    let row = "";
    for (let c = 0; c < cols; c++) row += (c >= left && c <= right) ? "1" : "0";
    grid.push(row);
  }
  return grid;
}
const STAND = buildStandingMatrix();
const DUCK = buildDuckMatrix();
function drawMatrix(grid, x, y, color){
  ctx.fillStyle = color;
  for (let r = 0; r < grid.length; r++){
    const row = grid[r];
    let c = 0;
    while (c < row.length){
      if (row[c] === "1"){
        let start = c;
        while (c < row.length && row[c] === "1") c++;
        ctx.fillRect(Math.round(x + start*PX), Math.round(y + r*PX), (c-start)*PX, PX);
      } else c++;
    }
  }
}

function initGroundDots(){
  groundDots = [];
  for (let i = 0; i < 40; i++){
    groundDots.push({ x: Math.random()*600, w: 2 + Math.random()*3 });
  }
}
function initClouds(){
  clouds = [];
  for (let i = 0; i < 3; i++){
    clouds.push({ x: Math.random()*600, y: 20 + Math.random()*35 });
  }
}

function reset(){
  score = 0; speed = 6; t = 0; spawnTimer = 40; obstacles = [];
  dino.y = GROUND - dino.h; dino.vy = 0; dino.duck = false; dino.dead = false;
  lastMilestone = 0;
  initGroundDots(); initClouds();
  state = "running";
}

function startOrJump(){
  if (state === "ready" || state === "over"){ reset(); return; }
  if (state === "running" && !dino.duck && dino.y >= GROUND - dino.h - 1){
    dino.vy = -10.5; jumpSound();
  }
}

window.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp"){ e.preventDefault(); startOrJump(); }
  if (e.code === "ArrowDown"){ downHeld = true; }
});
window.addEventListener("keyup", e => { if (e.code === "ArrowDown") downHeld = false; });
canvas.addEventListener("pointerdown", e => { e.preventDefault(); startOrJump(); });

function spawnObstacle(){
  const isBird = score > 250 && Math.random() < 0.28;
  if (isBird){
    const levels = [GROUND-70, GROUND-40, GROUND-14];
    obstacles.push({ type:"bird", x:600, y: levels[Math.floor(Math.random()*3)], w:34, h:20, frame:0 });
  } else {
    const n = 1 + Math.floor(Math.random()*3);
    obstacles.push({ type:"cactus", x:600, y: GROUND-30, w:12*n+4, h:30, n });
  }
}

function rect(x,y,w,h,c=FG){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }

function drawDino(){
  const x = dino.x, y = dino.y;
  const color = dino.dead ? DIM : FG;

  if (dino.duck){
    drawMatrix(DUCK, x, y, color);
    rect(x + 24*PX, y + 1*PX, PX, PX, BG); // eye
    rect(x + 22*PX, y + 8*PX, PX*2, PX, BG); // mouth notch
    const f = dino.legFrame;
    if (f === 0) rect(x+4*PX, y+11*PX, PX*3, PX*2);
    else         rect(x+10*PX, y+11*PX, PX*3, PX*2);
    return;
  }

  drawMatrix(STAND, x, y, color);
  rect(x + 17*PX, y + 3*PX, PX, PX, BG);      // eye
  rect(x + 16*PX, y + 8*PX, PX*3, PX, BG);    // open-mouth notch
  rect(x + 15*PX, y + 12*PX, PX*3, PX*2, color); // small arm

  if (dino.dead){
    rect(x+6*PX, y+21*PX, PX*3, PX*2);
    rect(x+13*PX, y+21*PX, PX*3, PX*2);
    return;
  }
  const f = dino.legFrame;
  if (f === 0){ rect(x+6*PX,y+21*PX,PX*3,PX*1); rect(x+13*PX,y+21*PX,PX*3,PX*4); }
  else        { rect(x+6*PX,y+21*PX,PX*3,PX*4); rect(x+13*PX,y+21*PX,PX*3,PX*1); }
}

function drawCactus(o){
  ctx.fillStyle = FG;
  for (let i=0;i<o.n;i++){
    const cx = o.x + i*12;
    rect(cx+3, o.y+6, 6, 24);
    rect(cx, o.y+10, 3, 5);
    rect(cx+9, o.y+16, 3, 5);
  }
}
function drawBird(o){
  ctx.fillStyle = FG;
  rect(o.x+8, o.y+6, 18, 8);
  const up = Math.floor(o.frame/8)%2===0;
  if (up){ rect(o.x+2,o.y,10,7); rect(o.x+22,o.y,10,7); }
  else   { rect(o.x+2,o.y+12,10,7); rect(o.x+22,o.y+12,10,7); }
}

function drawGround(){
  rect(0, GROUND, 600, 2, FG);
  ctx.fillStyle = DIM;
  groundDots.forEach(d => ctx.fillRect(Math.round(d.x), GROUND+8, d.w, 2));
}

function drawSky(){
  rect(0,0,600,180,BG);
  ctx.fillStyle = DIM; ctx.globalAlpha = 0.35;
  // moon
  ctx.beginPath(); ctx.arc(60,34,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = BG; ctx.beginPath(); ctx.arc(65,30,11,0,Math.PI*2); ctx.fill();
  // stars
  ctx.fillStyle = DIM;
  rect(140,26,3,3); rect(141.5,24,1,7); rect(138,27.5,7,1);
  rect(500,50,2,2);
  ctx.globalAlpha = 1;
  // clouds
  ctx.globalAlpha = 0.4;
  clouds.forEach(cl => {
    rect(cl.x, cl.y, 26, 4, DIM);
    rect(cl.x+5, cl.y-4, 14, 4, DIM);
  });
  ctx.globalAlpha = 1;
}

function drawScore(){
  ctx.textAlign = "left";
  ctx.font = "bold 14px monospace";
  ctx.fillStyle = DIM;
  ctx.fillText("HI " + String(Math.max(hi, Math.floor(score))).padStart(5,"0") +
               "  " + String(Math.floor(score)).padStart(5,"0"), 600-158, 22);
}

function drawReady(){
  ctx.fillStyle = DIM;
  ctx.font = "14px Arial, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("Tap the dino to play", 46, 100);
}

function drawGameOver(){
  ctx.fillStyle = FG;
  ctx.textAlign = "center";
  ctx.font = "bold 16px monospace";
  ctx.fillText("G A M E   O V E R", 300, 60);
  // restart icon (rounded square + refresh arrow)
  ctx.strokeStyle = FG; ctx.lineWidth = 1.5;
  ctx.strokeRect(284, 74, 32, 32);
  ctx.beginPath();
  ctx.arc(300, 90, 9, 0.3*Math.PI, 1.9*Math.PI);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(300+9*Math.cos(0.3*Math.PI), 90+9*Math.sin(0.3*Math.PI));
  ctx.lineTo(300+13*Math.cos(0.3*Math.PI), 90+9*Math.sin(0.3*Math.PI)-4);
  ctx.lineTo(300+9*Math.cos(0.3*Math.PI)+4, 90+9*Math.sin(0.3*Math.PI)+3);
  ctx.closePath(); ctx.fill();
}

function update(dt){
  if (state !== "running") return;
  t += dt;
  score += dt * 10;
  speed = Math.min(13, 6 + score/400);

  if (Math.floor(score) - lastMilestone >= 100){ lastMilestone = Math.floor(score); pointSound(); }

  dino.duck = downHeld && dino.y >= GROUND - dino.h - 1;
  const targetH = dino.duck ? 26 : 44;
  dino.h = targetH;
  dino.w = dino.duck ? 56 : 44;

  dino.vy += 0.6 * dt * 60;
  dino.y += dino.vy * dt * 60;
  if (dino.y > GROUND - dino.h){ dino.y = GROUND - dino.h; dino.vy = 0; }

  dino.legFrame = Math.floor(t*10) % 2;

  spawnTimer -= dt*60;
  if (spawnTimer <= 0){ spawnObstacle(); spawnTimer = Math.max(35, 70 - speed*3); }

  obstacles.forEach(o => { o.x -= speed*dt*60; o.frame += dt*60; });
  obstacles = obstacles.filter(o => o.x > -60);

  const dx = dino.x+6, dy = dino.y+6, dw = dino.w-12, dh = dino.h-10;
  for (const o of obstacles){
    const ox = o.x+4, oy = o.y+4, ow = o.w-8, oh = o.h-8;
    if (dx < ox+ow && dx+dw > ox && dy < oy+oh && dy+dh > oy){
      state = "over"; dino.dead = true;
      hi = Math.max(hi, Math.floor(score));
      overSound();
      break;
    }
  }

  groundDots.forEach(d => { d.x -= speed*dt*60; if (d.x < -5) d.x = 600 + Math.random()*20; });
  clouds.forEach(cl => { cl.x -= speed*0.3*dt*60; if (cl.x < -30) cl.x = 600 + Math.random()*40; });
}

function render(){
  drawSky();
  drawGround();
  obstacles.forEach(o => o.type === "bird" ? drawBird(o) : drawCactus(o));
  drawDino();
  drawScore();
  if (state === "ready") drawReady();
  if (state === "over") drawGameOver();
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.035, (now-last)/1000); last = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
dino.h = 44; dino.y = GROUND - dino.h;
initGroundDots(); initClouds();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
